name: Rise&Lead Telegram Engine

on:
  schedule:
    - cron: "30 2 * * *"
    - cron: "30 5 * * *"
    - cron: "30 8 * * *"
    - cron: "0 12 * * *"
    - cron: "0 15 * * *"
  workflow_dispatch:

concurrency:
  group: riselead-telegram
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Telegram engine
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL: ${{ secrets.TELEGRAM_CHANNEL }}
        run: |
          python main.py run

      - name: Persist publishing history
        run: |
          git config user.name "Rise&Lead Bot"
          git config user.email "actions@users.noreply.github.com"
          git add telegram_native_history.json
          git diff --cached --quiet || git commit -m "Update Telegram publishing history"
          git push
